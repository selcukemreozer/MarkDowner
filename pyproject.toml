[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markdowner"
version = "1.0.0"
description = "Interactive terminal CLI to convert files to Markdown using markitdown"
requires-python = ">=3.10"
dependencies = [
    "markitdown[all]",
    "inquirer",
]

[project.scripts]
markdowner = "file_converter:main"

[tool.setuptools]
py-modules = ["file_converter"]
